## 🎯 Priority & Effort

**Priority:**
- [ ] 🔴 **Blocker** - Blocks other work, must be done now
- [ ] 🟡 **High** - Important, should be done soon
- [ ] 🟢 **Medium** - Nice to have, can wait
- [ ] 🔵 **Low** - Backlog item

**Estimated Effort:**
- [ ] ⏱️ **Small** (1-2 days)
- [ ] ⏳ **Medium** (3-5 days)
- [ ] 📅 **Large** (1-2 weeks)
- [ ] 🏗️ **Epic** (2+ weeks, needs breakdown)

